# Cloudflare Workers (free plan is enough: 100k requests/day).
# Deploy: npx wrangler deploy --config api/wrangler.toml   (needs a Cloudflare account, see api/README.md)
name = "buildproof-x402"
main = "worker.mjs"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
PAY_TO = "0xC628715a1ed46eb555B088e3d43dc61AE0134F33"
PRICE = "$0.01"
# Payment rail: Base mainnet, USDC 0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913,
# PayAI facilitator (no API key; its /supported lists eip155:8453 exact).
# Testnet alternative: X402_NETWORK = "eip155:84532", FACILITATOR_URL = "https://x402.org/facilitator".
X402_NETWORK = "eip155:8453"
FACILITATOR_URL = "https://facilitator.payai.network"
# BuildProofRegistry on Base mainnet (deployments/8453.json, deployed 2026-10-09).
BP_RPC = "https://mainnet.base.org"
BP_REGISTRY = "0xF818e4A95BBA02c822bCa8A0CFB50a2Ae4B8eE94"
PUBLIC_URL = "https://buildproof-x402.zbignevich.workers.dev"

# NEAR AI Agent Market (https://buildproof.market.near.ai): poll assignments every minute.
# Secrets: wrangler secret put NEAR_MARKET_TOKEN / NEAR_WEBHOOK_SECRET (see api/README.md).
[triggers]
crons = ["* * * * *"]
